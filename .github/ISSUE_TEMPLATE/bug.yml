name: Bug
description: Something is broken
labels: [bug]
body:
  - type: input
    id: game
    attributes:
      label: Game and version
      placeholder: block-battle 0.1.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Terminal, Claude Desktop (Code tab), Both]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened and how to reproduce it
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
