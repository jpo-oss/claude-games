name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -g @anthropic-ai/claude-code@latest
      - run: claude plugin validate .
      - name: Test each game
        run: for dir in plugins/*/; do claude plugin test "$dir"; done
